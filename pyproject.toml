[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-support-ticket-automation-backend"
version = "0.1.0"
description = "Multi-agent support ticket automation API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "pydantic-settings==2.10.1",
    "uvicorn[standard]==0.35.0",
    "SQLAlchemy==2.0.43",
    "alembic==1.16.5",
    "psycopg[binary,pool]==3.2.9",
    "httpx==0.28.1",
    "chromadb==1.5.9",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "prometheus-client==0.22.1",
    "PyJWT==2.15.1",
    "pwdlib[argon2]==0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff==0.16.2",
    "mypy==2.3.1",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F401", "F841"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
